  revision: aa35f433319895b3dbea0352a5c9495a23ef4c8e
  manifest: sources/models/excavator/source.yaml
  upstream_paths:
    - license.txt
    - ExcavatorCADFiles/URDF_MathScavator9000_flat/MathScavator9000_flat/package.xml
    - ExcavatorCADFiles/URDF_MathScavator9000_flat/MathScavator9000_flat/urdf/
    - ExcavatorCADFiles/URDF_MathScavator9000_flat/MathScavator9000_flat/meshes/

